<!DOCTYPE html><html lang="pt-BR">
<head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeria de Artes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet"        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
 
    <header class="hero">
        <div class="overlay"></div>
        <div class="hero-content">
        <h1>                GALERIA <br>                DE ARTES            </h1>
        <div class="linha"></div>
        <p>                Uma jornada pela história da arte,                seus artistas, obras e estilos que marcaram épocas.            </p>
        <button id="btnEntrar">                ENTRAR            </button>
        <button id="scrollDown" class="scroll-button">                <i class="fa-solid fa-chevron-down"></i>            </button>
        </div>
    </header>


    <main id="explorar">
        <section class="explorar">
            <span class="subtitulo">                EXPLORAR            </span>
            <h2>                Listagem            </h2>
            <div class="linha-pequena"></div>
            <div class="cards">
               
                <article class="card" onclick="abrirPagina('../pages/obras.html')">
                    <img src="obras.jpg" alt="Obras">
                    <div class="card-conteudo">

                        <h3>                            OBRAS                        </h3>
                        <div class="linha-card"></div>
                        <span>                            LISTAGEM                        </span>
                    </div>
                </article>
           
                <article class="card" onclick="abrirPagina('../pages/artistas.html')">
                    <img src="artistas.jpg" alt="Artistas">
                    <div class="card-conteudo">
                        <h3>                            ARTISTAS                        </h3>
                        <div class="linha-card"></div>
                        <span>                            LISTAGEM                        </span>
                    </div>
                </article>
              
                <article class="card" onclick="abrirPagina('../pages/estilohistorico.html')">
                    <img src="periodosLiterarios.jpg" alt="Períodos">
                    <div class="card-conteudo">
                        <h3>
                            PERÍODOS <br>                            HISTÓRICOS
                        </h3>
                        <div class="linha-card"></div>
                        <span>                            LISTAGEM                        </span>
                    </div>
                </article>
            </div>
        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
